<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CookedYet</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-icon-180x180.png" />
  <link rel="manifest" href="icons/manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
      <img src="icons/apple-icon-76x76.png" alt="CookedYet" style="width: 48px; height: 48px;" />
      <h1 style="margin: 0;">Is It Cooked Yet?</h1>
    </div>

    <div class="grid">
      <!-- Left: chart + result -->
      <div class="card">
        <div class="split">
          <div class="muted">
            Add temperature readings as you cook. We'll tell you when it's done.
          </div>
          <div id="etaPill" class="pill warn">Need 3+ readings</div>
        </div>

        <div style="height:8px"></div>
        <div id="currentStatus" class="muted small" style="display:none;"></div>

        <div style="height:12px"></div>
        <div class="chart">
          <canvas id="chart" width="900" height="300"></canvas>
        </div>

        <div style="height:12px"></div>
        <div id="chartLegend" class="muted small" style="display:none; margin-bottom:8px;"></div>
        <div class="muted small fit-details" id="fitInfo">Fit: —</div>
      </div>

      <!-- Right: controls + list -->
      <div class="card">
        <div class="row">
          <label>
            Target preset
            <select id="targetPreset">
              <!-- Keep editable. Validate temps against your preferred official guidance later. -->
              <option value="custom">Custom…</option>
              <option value="125">Beef - Rare (125°F)</option>
              <option value="135">Beef - Medium Rare (135°F)</option>
              <option value="145">Beef - Medium (145°F)</option>
              <option value="155">Beef - Medium Well (155°F)</option>
              <option value="165">Poultry (165°F)</option>
              <option value="145">Pork (145°F)</option>
              <option value="145">Fish (145°F)</option>
              <option value="160">Ground meats (160°F)</option>
            </select>
          </label>

          <label>
            Desired °F (final)
            <input id="targetTempFinal" type="number" step="0.1" value="140" />
          </label>
        </div>

        <div style="height:10px"></div>

        <div class="row">
          <div class="checkline">
            <input id="useCarryover" type="checkbox" />
            <div>
              <div style="font-size:12px; font-weight:700;">Use carryover</div>
              <div class="muted small">Target becomes “pull temp” = final − carryover</div>
            </div>
          </div>

          <label>
            Carryover °F
            <input id="carryoverF" type="number" step="0.1" value="5" />
          </label>
        </div>

        <div style="height:10px"></div>

        <div class="row">
          <label>
            Time (HH:MM)
            <input id="readingTime" type="time" />
          </label>

          <label>
            Temp (°F)
            <input id="readingTemp" type="number" step="0.1" placeholder="e.g., 118" />
          </label>

          <button id="addBtn">+ Add Reading</button>
          <button id="clearBtn" class="danger">Clear</button>
        </div>

        <div style="height:8px"></div>
        <div class="muted small" id="targetExplain"></div>

        <div style="height:14px"></div>

        <div>
          <div class="split">
            <div><strong>Readings</strong></div>
            <div class="muted small" id="readingCount">0</div>
          </div>
          <div style="height:8px"></div>
          <table>
            <thead>
              <tr>
                <th>Time</th>
                <th class="right">Temp °F</th>
                <th class="right">t (min)</th>
                <th class="right">Remove</th>
              </tr>
            </thead>
            <tbody id="readingTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
